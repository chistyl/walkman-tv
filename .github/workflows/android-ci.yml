name: Android CI

on:
  pull_request:
    branches:
      - feature/full-performance-optimization
      - perf/startup-cache-render-optimization
      - fix/platform-source-switch-crash
      - feature/cross-source-auto-failover
      - recovery/restore-run62
  push:
    branches:
      - fix/taiwan-traditional-context-conversion
      - fix/platform-source-switch-crash
      - fix/kugou-qq-playback
      - feature/cross-source-auto-failover

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete source archive
        if: success()
        run: git archive --format=zip --output=walkman-tv-source.zip HEAD

      - name: Upload complete source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-complete-source
          path: walkman-tv-source.zip
          if-no-files-found: error
          retention-days: 14
