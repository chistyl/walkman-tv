name: Apply Walkman TV Branding Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-branding-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branding branch
        uses: actions/checkout@v4
        with:
          ref: fix/lyrics-fetch-reliability
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and extract branding package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="branding-assets/walkman-tv-branding-ready-to-apply.zip"
          test -f "$PACKAGE"
          mkdir -p /tmp/walkman-branding
          unzip -q "$PACKAGE" -d /tmp/walkman-branding
          SOURCE="/tmp/walkman-branding/walkman-tv-branding/app/src/main/res"
          test -d "$SOURCE"
          test -f /tmp/walkman-branding/walkman-tv-branding/README.txt
          echo "素材包檔案數：$(find "$SOURCE" -type f | wc -l)"
          cp -R "$SOURCE/." app/src/main/res/

      - name: Commit branding assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          if ! git diff --cached --quiet; then
            git commit -m "Replace app icon and banner with supplied branding"
            git push origin HEAD:fix/lyrics-fetch-reliability
          else
            echo "素材已存在最新版本，直接進行測試與建置。"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run regression tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest testUserApiPreload --no-daemon --stacktrace

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-universal
          path: app/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error
