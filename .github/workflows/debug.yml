name: Debug Build

# Builds debug APKs and a source archive for non-main branches.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run regression tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest testUserApiPreload --no-daemon --stacktrace

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package complete source
        run: |
          mkdir -p dist
          zip -r dist/walkman-tv-source-${GITHUB_SHA::7}.zip . \
            -x '.git/*' '.gradle/*' '**/build/*' '*/build/*' \
               'local.properties' 'dist/*'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-source
          path: dist/walkman-tv-source-${GITHUB_SHA::7}.zip
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: walkman-tv-debug-universal
          path: app/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error
